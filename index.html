<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>کافه پرواز</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div class="header-inner">

        <div class="brand">

            <h1>
                کافه پرواز
            </h1>

            <span>
                شرکت هوانوردی عقاب آسمان شمال
            </span>

        </div>


        <button
            id="cartButton"
            class="cart-button"
            type="button"
        >

            🛒

            <span id="cartCount">
                ۰
            </span>

        </button>

    </div>

</header>



<!-- =====================================================
     MAIN
===================================================== -->

<main>


    <!-- SEARCH -->

    <section class="search-section">

        <input
            id="searchInput"
            type="search"
            placeholder="جستجوی محصول..."
        >

    </section>



    <!-- =================================================
         CATEGORIES
    ================================================== -->

    <nav class="categories">

        <button
            class="category active"
            data-category="all"
            type="button"
        >
            همه
        </button>


        <button
            class="category"
            data-category="hot"
            type="button"
        >
            نوشیدنی گرم
        </button>


        <button
            class="category"
            data-category="cold"
            type="button"
        >
            نوشیدنی سرد
        </button>


        <button
            class="category"
            data-category="snacks"
            type="button"
        >
            تنقلات
        </button>


        <button
            class="category"
            data-category="breakfast"
            type="button"
        >
            صبحانه
        </button>


        <button
            class="category"
            data-category="other"
            type="button"
        >
            سایر
        </button>

    </nav>



    <!-- =================================================
         PRODUCTS
    ================================================== -->

    <section
        id="products"
        class="products"
    >
    </section>


    <section
        id="emptyState"
        class="empty-state"
        hidden
    >

        <div>
            🔎
        </div>

        <h3>
            محصولی پیدا نشد
        </h3>

        <p>
            محصول دیگری را جستجو کنید.
        </p>

    </section>


</main>



<!-- =====================================================
     FLOATING CART
===================================================== -->

<button
    id="floatingCart"
    class="floating-cart"
    type="button"
    hidden
>

    🛒

    <span id="cartTotal">
        ۰ محصول
    </span>

</button>



<!-- =====================================================
     ADMIN BUTTON
===================================================== -->

<button
    id="adminButton"
    class="admin-button"
    type="button"
>
    ⚙️
</button>



<!-- =====================================================
     CART MODAL
===================================================== -->

<div
    id="cartModal"
    class="modal"
    hidden
>

    <div
        id="modalOverlay"
        class="modal-overlay"
    ></div>


    <div class="modal-box">

        <button
            id="closeCart"
            class="modal-close"
            type="button"
        >
            ×
        </button>


        <h2>
            سبد سفارش
        </h2>


        <div
            id="cartItems"
            class="cart-items"
        >
        </div>


        <button
            id="checkoutButton"
            class="primary-button"
            type="button"
        >
            ادامه و ثبت سفارش
        </button>

    </div>

</div>



<!-- =====================================================
     CHECKOUT MODAL
===================================================== -->

<div
    id="checkoutModal"
    class="modal"
    hidden
>

    <div
        id="checkoutOverlay"
        class="modal-overlay"
    ></div>


    <div class="modal-box">

        <h2>
            ثبت سفارش
        </h2>


        <form id="orderForm">


            <label>
                شماره میز
            </label>

            <input
                id="tableNumber"
                type="text"
                placeholder="مثلاً ۵"
                required
            >


            <label>
                نام
            </label>

            <input
                id="customerName"
                type="text"
                placeholder="نام شما"
            >


            <label>
                توضیحات
            </label>

            <textarea
                id="customerNote"
                placeholder="مثلاً بدون شکر..."
            ></textarea>


            <button
                type="submit"
                class="primary-button"
            >
                ثبت سفارش
            </button>


        </form>

    </div>

</div>



<!-- =====================================================
     ADMIN LOGIN
===================================================== -->

<div
    id="adminLoginModal"
    class="modal"
    hidden
>

    <div
        id="adminLoginOverlay"
        class="modal-overlay"
    ></div>


    <div class="modal-box admin-login-box">

        <button
            id="closeAdminLogin"
            class="modal-close"
            type="button"
        >
            ×
        </button>


        <h2>
            ورود به مدیریت
        </h2>


        <p>
            رمز مدیریت را وارد کنید
        </p>


        <input
            id="adminPassword"
            type="password"
            placeholder="رمز عبور"
            autocomplete="off"
        >


        <p
            id="loginError"
            class="login-error"
            hidden
        >
            رمز عبور اشتباه است
        </p>


        <button
            id="loginButton"
            class="primary-button"
            type="button"
        >
            ورود
        </button>

    </div>

</div>



<!-- =====================================================
     ADMIN PANEL
===================================================== -->

<div
    id="adminPanel"
    class="admin-panel"
    hidden
>

    <div class="admin-container">


        <!-- ADMIN HEADER -->

        <div class="admin-header">

            <div>

                <h2>
                    پنل مدیریت کافه
                </h2>

                <p>
                    مدیریت محصولات و سفارش‌ها
                </p>

            </div>


            <button
                id="closeAdminPanel"
                class="modal-close"
                type="button"
            >
                ×
            </button>

        </div>



        <!-- =================================================
             ADMIN TABS
        ================================================== -->

        <div class="admin-tabs">

            <button
                class="admin-tab active"
                data-admin-tab="products"
                type="button"
            >
                📦 محصولات
            </button>


            <button
                class="admin-tab"
                data-admin-tab="orders"
                type="button"
            >
                🛎️ سفارش‌ها

                <span id="adminOrderCount">
                    ۰
                </span>

            </button>

        </div>



        <!-- =================================================
             PRODUCTS MANAGEMENT
        ================================================== -->

        <section
            id="adminProducts"
            class="admin-section"
        >


            <div class="admin-section-header">

                <div>

                    <h3>
                        محصولات
                    </h3>

                    <p>
                        محصولات منو را مدیریت کنید
                    </p>

                </div>


                <button
                    id="addProductButton"
                    class="primary-admin-button"
                    type="button"
                >
                    ＋ محصول جدید
                </button>

            </div>


            <div
                id="adminProductList"
                class="admin-product-list"
            >
            </div>


        </section>



        <!-- =================================================
             ORDERS MANAGEMENT
        ================================================== -->

        <section
            id="adminOrders"
            class="admin-section"
            hidden
        >


            <div class="admin-section-header">

                <div>

                    <h3>
                        سفارش‌ها
                    </h3>

                    <p>
                        سفارش‌های مشتریان
                    </p>

                </div>

            </div>


            <div
                id="adminOrderList"
                class="admin-order-list"
            >
            </div>


        </section>


    </div>

</div>



<!-- =====================================================
     PRODUCT MODAL
===================================================== -->

<div
    id="productModal"
    class="modal"
    hidden
>

    <div
        id="productModalOverlay"
        class="modal-overlay"
    ></div>


    <div class="modal-box">


        <button
            id="cancelProduct"
            class="modal-close"
            type="button"
        >
            ×
        </button>


        <h2 id="productModalTitle">
            محصول جدید
        </h2>


        <form id="productForm">


            <!-- ID مخفی -->

            <input
                id="editProductId"
                type="hidden"
            >


            <!-- NAME -->

            <label>
                نام محصول
            </label>

            <input
                id="productName"
                type="text"
                placeholder="مثلاً لاته"
                required
            >


            <!-- DESCRIPTION -->

            <label>
                توضیحات
            </label>

            <textarea
                id="productDescription"
                placeholder="توضیحات محصول..."
            ></textarea>


            <!-- CATEGORY -->

            <label>
                دسته‌بندی
            </label>

            <select
                id="productCategory"
                required
            >

                <option value="hot">
                    نوشیدنی گرم
                </option>

                <option value="cold">
                    نوشیدنی سرد
                </option>

                <option value="snacks">
                    تنقلات
                </option>

                <option value="breakfast">
                    صبحانه
                </option>

                <option value="other">
                    سایر
                </option>

            </select>


            <!-- SAVE -->

            <button
                type="submit"
                class="primary-button"
            >
                ذخیره محصول
            </button>


        </form>

    </div>

</div>



<!-- =====================================================
     SCRIPT
===================================================== -->

<script
    src="script.js"
></script>


</body>

</html>
